<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Babylon Merkezi Dinamik Oynatıcı</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
        canvas { width: 100%; height: 100%; display: block; background: transparent !important; }
    </style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    
    // Arka planı şeffaf yapıyoruz ki Wix'teki mor zemin sırıtmasın
    scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);

    // 🌐 URL PARAMETRELERİNİ OKUYAN SİHİRLİ FONKSİYON (Wix'ten gelen emirleri yakalar)
    const urlParams = new URLSearchParams(window.location.search);
    
    const modelName = urlParams.get('model') || "ek_2026-1"; // Model adı yoksa varsayılan ek_2026-1 açılır
    const pAlpha    = parseFloat(urlParams.get('alpha')) || -Math.PI / 2;
    const pBeta     = parseFloat(urlParams.get('beta')) || Math.PI / 3;
    const pRadius   = parseFloat(urlParams.get('radius')) || 10;
    const pMouse    = urlParams.get('mouse') === "1"; // "1" ise mouse açılır, "0" ise kilitlenir

    // 🎯 DİNAMİK KAMERA (Wix'ten gönderdiğin milimetrik ayarlarla kurulur)
    const camera = new BABYLON.ArcRotateCamera(
        "camera",
        pAlpha,
        pBeta,
        pRadius,
        BABYLON.Vector3.Zero(),
        scene
    );

    // MOUSE / FARE KONTROLÜ AYARI
    if (pMouse) {
        camera.attachControl(canvas, true); // Eğer mouse=1 ise kullanıcı döndürebilir
    } else {
        camera.detachControl(); // Eğer mouse=0 ise fare tamamen kilitlenir (Intro modu)
        camera.inputs.clear();
    }

    const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

    // GitHub'daki GLB dosyasının tam yolu
    const finalGLBPath = "https://raw.githubusercontent.com/erdemkaraoglu/my-3d-models/main/" + modelName + ".glb";

    // GLB Model Yükleyici
    BABYLON.SceneLoader.Append("", finalGLBPath, scene, function (loadedScene) {
        console.log("Model başarıyla merkezi sisteme yüklendi: " + modelName);
    }, null, function (scene, message) {
        console.error("GLB Yükleme Hatası:", message);
    });

    engine.runRenderLoop(() => { scene.render(); });
    window.addEventListener("resize", () => { engine.resize(); });
</script>

</body>
</html>
